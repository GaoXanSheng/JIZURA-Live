<!DOCTYPE html>
<!-- JS 黄金值 harness：无头 Edge 加载本页，按 query 参数跑 case：
     ?case=smoke  →  读 /cases/smoke.json，J.plan + Renderer.frame 逐 t 出帧，
                      结果（plan JSON + PNG dataURL）POST /save?name=<case>
     对齐措施：禁用 Intl.Segmenter（C# 侧 segments 用字符类回退，表面必须一致），
                不加载 11p_* 表现包（C# 当前注册面 = 核心文件） -->
<html>
<head><meta charset="utf-8"><title>parity</title></head>
<body>
<pre id="status">boot</pre>
<script>
  // 必须先于引擎：对齐 C# 的字符类分词回退
  if (window.Intl) { try { delete Intl.Segmenter; } catch (e) { Intl.Segmenter = undefined; } }
</script>
<script src="/engine/01_util.js"></script>
<script src="/engine/02b_lang.js"></script>
<script src="/engine/02_fonts.js"></script>
<script src="/engine/03_text.js"></script>
<script src="/engine/04_styles.js"></script>
<script src="/engine/05_anim.js"></script>
<script src="/engine/05b_registry.js"></script>
<script src="/engine/06_layouts.js"></script>
<script src="/engine/07_decor.js"></script>
<script src="/engine/08_planner.js"></script>
<script src="/engine/09_render.js"></script>
<script src="/engine/10_audio.js"></script>
<script src="/engine/10b_audiofx.js"></script>
<script>
(async () => {
  const S = m => { document.getElementById('status').textContent = m; document.title = m; };
  try {
    const qs = new URLSearchParams(location.search);
    const name = qs.get('case') || 'smoke';
    const runFrames = qs.get('frames') !== '0';

    // 字体控制变量：?famsys=1 时与 C# 侧兜底同款——全部字体键映射到同一系统字体，
    // 把「字体差异」从帧对比里剥离（引擎差异才是本次对拍对象）
    if (qs.get('famsys') === '1') {
      const w400 = qs.get('w400') === '1';
      for (const k of Object.keys(J.FONTS)) {
        const f = J.FONTS[k];
        f.family = '"Yu Gothic"';
        f.fb = null;
        delete f.gf;
        if (w400) f.weight = 400;
      }
    }

    const cs = await (await fetch('/cases/' + name + '.json')).json();
    S('plan:' + name);

    const project = Object.assign(J.defaultProject(), cs.project || {});
    if (cs.project && cs.project.timing)
      project.timing = Object.assign(J.defaultProject().timing, cs.project.timing);
    if (cs.project && cs.project.fx)
      project.fx = Object.assign(J.defaultProject().fx, cs.project.fx);

    const audio = cs.audio || null;
    if (audio && audio.energy) audio.energy = Float32Array.from(audio.energy);
    if (audio && audio.peaks) audio.peaks = Float32Array.from(audio.peaks);
    if (audio && audio.pitch) audio.pitch = Float32Array.from(audio.pitch);

    const plan = J.plan(project, audio);

    const out = { name, plan, frames: [] };
    // 字体探针：两侧同 key 同字号量宽，验证字体表面是否真的一致
    out.probe = {};
    // layoutText 逐字探针：定位绘制层字距/位置漂移
    try {
      const lay = J.layoutText({ text: '夜明けの色を覚えてる', font: 'gothic_bold', size: 120, track: 0.05 });
      out.lay = lay.map(c => [+c.x.toFixed(2), +c.y.toFixed(2), +c.w.toFixed(2), +c.h.toFixed(2)]);
      out.layW = +lay.W.toFixed(2); out.layH = +lay.H.toFixed(2);
    } catch (e) { out.lay = 'ERR ' + e.message; }
    for (const pk of ['gothic_bold', 'mincho', 'dela'])
      try {
        out.probe[pk] = J.measure({ text: '夜あA', font: pk, size: 100 }).w;
      } catch (e) { out.probe[pk] = 'ERR ' + e.message; }

    if (runFrames) {
      const renderer = new J.Renderer();
      for (const t of (cs.times || [])) {
        const c = document.createElement('canvas');
        c.width = plan.W; c.height = plan.H;
        const x = c.getContext('2d');
        renderer.frame(x, plan, t, { scale: 1 });
        out.frames.push({ t, png: c.toDataURL('image/png') });
        S('frame t=' + t);
      }
    }

    S('save:' + name);
    const body = JSON.stringify(out);
    const suffix = (qs.get('famsys') === '1' ? '.sys' : '') + (qs.get('w400') === '1' ? '.w4' : '');
    await fetch('/save?name=' + name + suffix + '.js', { method: 'POST', body });
    S('done:' + name);
  } catch (e) {
    S('ERROR ' + (e && e.stack || e));
  }
})();
</script>
</body>
</html>
